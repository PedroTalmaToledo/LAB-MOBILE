server:
  port: 8080

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8081/.well-known/jwks.json

  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - AddResponseHeader=X-Processed-By, API-Gateway
          routes:
            - id: auth
              uri: http://localhost:8081
              predicates:
                - Path=/auth/**
              filters:
                - StripPrefix=1
            - id: pedidos
              uri: http://localhost:8082
              predicates:
                - Path=/pedidos/**
              filters:
                - StripPrefix=1
            - id: rastreamento
              uri: http://localhost:8083
              predicates:
                - Path=/rastreamento/**
              filters:
                - StripPrefix=1
            - id: notificacoes
              uri: http://localhost:8084
              predicates:
                - Path=/notificacoes/**
              filters:
                - StripPrefix=1
